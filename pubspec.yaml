name: pemesanan_tiket
description: "Aplikasi Pemesanan Tiket Wisata Jogja bernama 'Lelungan Jogja' "
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0 # Font Poppins
  supabase_flutter: ^2.8.0 # Supabase Database & Auth

  # Icon bawaan Flutter
  cupertino_icons: ^1.0.8

  # Paket Tambahan Tugas Akhir PAM:
  crypto: ^3.0.3 # Enkripsi Password (SHA-256)
  local_auth: ^2.1.6 # Login Biometric (Fingerprint/Face ID)

  # Paket Peta LBS (OpenStreetMap - Web/Map API)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Sensor GPS Device & AI Chatbot Gemini:
  geolocator: ^10.1.0 # Sensor GPS Device Native
  google_generative_ai: ^0.4.0 # Gemini API

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Jika nanti ingin menambahkan gambar lokal (assets), uncomment bagian di bawah ini:
  # assets:
  #   - assets/images/